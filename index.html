    <script>
      // Filter out noisy errors injected by external browser extensions (e.g. Talisman, crypto wallets)
      (function() {
        function isExtensionError(msg, src, err) {
          var str = (msg || '') + ' ' + (src || '') + ' ' + (err && err.stack ? err.stack : '');
          return (
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('Talisman') !== -1 ||
            str.indexOf('extension has not been configured') !== -1
          );
        }

        var origOnError = window.onerror;
        window.onerror = function(msg, src, line, col, err) {
          if (isExtensionError(msg, src, err)) {
            return true;
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.message, event.filename, event.error)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = (event.reason && (event.reason.message || event.reason.stack)) || String(event.reason || '');
          if (
            reasonStr.indexOf('chrome-extension://') !== -1 ||
            reasonStr.indexOf('moz-extension://') !== -1 ||
            reasonStr.indexOf('Talisman') !== -1 ||
            reasonStr.indexOf('extension has not been configured') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
